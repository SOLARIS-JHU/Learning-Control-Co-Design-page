<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="method-title method-desc">
<title id="method-title">Learning constrained control co-design: prediction, lower-level control, and projected coupling correction</title>
<desc id="method-desc">A neural network initializes the design. Each correction evaluates the lower-level optimal control solution, differentiates a coupling-violation penalty through that solution, takes a design gradient step, and projects onto the design constraints. After the specified correction steps, a final lower-level solve produces the design and control pair. Offline training differentiates the objective and coupling penalty through this computation to update network weights. Moving QP iterates and design corrections illustrate a dimensionless example, not experimental data or the authors’ solver trace. The outer point follows one discrete gradient update; projection is a separate stage.</desc>
<defs><linearGradient id="paper" x2=".7" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4F9"/></linearGradient><linearGradient id="blue" x2=".7" y2="1"><stop stop-color="#FCFEFF"/><stop offset="1" stop-color="#DEEBF4"/></linearGradient><linearGradient id="teal" x2=".7" y2="1"><stop stop-color="#FBFFFE"/><stop offset="1" stop-color="#DAF0EB"/></linearGradient><linearGradient id="amber" x2=".7" y2="1"><stop stop-color="#FFFEFB"/><stop offset="1" stop-color="#F2E5CE"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#286F9C"/></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#148F87"/></marker>
<marker id="field-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7E9EAE" stroke-width="1.5"/></marker><marker id="gradient-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#9C6319"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#173B65}.title{font-size:22px;font-weight:650}.label{font-size:18px}.formula{font-family:Georgia,'Times New Roman',serif;font-size:24px}.small{font-size:16px;fill:#52677C}.kicker{font-size:15px;font-weight:600;letter-spacing:1.4px}.box{stroke:#C3D1DD;stroke-width:1.3}.wire{fill:none;stroke:#286F9C;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.loop{stroke:#148F87;marker-end:url(#return-arrow)}.step.active .box{stroke:#148F87;stroke-width:3.5}.step.active .number{fill:#0B716B}.number{fill:#286F9C}.numtext{fill:#FFFFFF;font-size:15px;font-weight:600}.net{stroke:#286F9C;stroke-width:1.2;opacity:.4}.neuron{fill:#FFFFFF;stroke:#286F9C;stroke-width:1.8}</style></defs>
<rect width="1100" height="760" rx="14" fill="url(#paper)"/><text x="30" y="33" class="kicker">DESIGN AND CONTROL ARE COUPLED</text><text x="30" y="60" class="small">One sampled problem p · prescribed number of correction steps K</text>
<g class="step" id="method-predict" data-step="predict"><rect class="box" x="30" y="85" width="290" height="205" rx="10" fill="url(#blue)"/><circle class="number" cx="53" cy="111" r="13"/><text class="numtext" x="53" y="116" text-anchor="middle">1</text><text class="title" x="76" y="119">Predict design</text>
<g class="net"><path d="M92 163L153 152M92 163L153 179M92 163L153 206M92 197L153 152M92 197L153 179M92 197L153 206M153 152L214 163M153 152L214 197M153 179L214 163M153 179L214 197M153 206L214 163M153 206L214 197"/></g><g class="neuron"><circle cx="92" cy="163" r="6"/><circle cx="92" cy="197" r="6"/><circle cx="153" cy="152" r="6"/><circle cx="153" cy="179" r="6"/><circle cx="153" cy="206" r="6"/><circle cx="214" cy="163" r="6"/><circle cx="214" cy="197" r="6"/></g><text class="formula" x="47" y="185">p</text><path class="wire" d="M62 179H78"/><path class="wire" d="M228 179H249"/><text class="formula" x="264" y="185">y⁰</text><text class="formula" x="175" y="247" text-anchor="middle">y⁰ = N<tspan font-size="16" baseline-shift="sub">θ</tspan>(p)</text><text class="small" x="175" y="274" text-anchor="middle">learned initialization</text></g>
<g class="step" id="method-lower" data-step="lower"><rect class="box" x="405" y="85" width="290" height="205" rx="10" fill="url(#blue)"/><circle class="number" cx="428" cy="111" r="13"/><text class="numtext" x="428" y="116" text-anchor="middle">2</text><text class="title" x="451" y="119">Solve inner control</text><text class="formula" x="550" y="146" style="font-size:20px" text-anchor="middle">zᵏ = Oₚ(yᵏ)</text><g id="qp-mesh">{{QP_MESH}}</g><path id="qp-trail" d="{{QP_TRAIL}}" fill="none" stroke="#BF8736" stroke-width="2.2"/><circle id="qp-target" cx="{{QP_TX}}" cy="{{QP_TY}}" r="5" fill="#148F87" stroke="#fff" stroke-width="1.5"/><circle id="qp-dot" cx="{{QP_DX}}" cy="{{QP_DY}}" r="5" fill="#BF8736" stroke="#fff" stroke-width="1.5"/><text x="550" y="280" class="small" style="font-size:13px" text-anchor="middle">Illustrative QP · objective + bound constraints</text></g>
<g class="step" id="method-coupling" data-step="coupling"><rect class="box" x="780" y="85" width="290" height="205" rx="10" fill="url(#amber)"/><circle class="number" cx="803" cy="111" r="13"/><text class="numtext" x="803" y="116" text-anchor="middle">3</text><text class="title" x="826" y="119">Measure coupling</text><text class="formula" x="925" y="166" text-anchor="middle">ν = [Uₚ(yᵏ, zᵏ)]₊</text><text class="label" x="925" y="203" text-anchor="middle">squared violation ‖ν‖²</text><text class="small" x="925" y="239" text-anchor="middle">Differentiate through Oₚ</text><text class="small" x="925" y="263" text-anchor="middle">to obtain the design gradient.</text></g>
<path class="wire" d="M320 181H405"/><text class="small" x="362" y="165" text-anchor="middle">design</text><path class="wire" d="M695 181H780"/><text class="small" x="738" y="165" text-anchor="middle">pair</text><path class="wire" d="M925 290V360"/><text class="small" x="941" y="328">gradient</text>
<g class="step" id="method-update" data-step="update"><rect class="box" x="780" y="360" width="290" height="205" rx="10" fill="url(#blue)"/><circle class="number" cx="803" cy="386" r="13"/><text class="numtext" x="803" y="391" text-anchor="middle">4</text><text class="title" x="826" y="394">Correct the design</text><text class="formula" x="925" y="423" style="font-size:20px" text-anchor="middle">ỹ = yᵏ − γ ∇ᵧ‖ν‖²</text><g id="outer-field">{{OUTER_FIELD}}</g><path id="outer-history" d="" fill="none" stroke="#286F9C" stroke-width="1.7" opacity=".65"/><path id="gradient-vector" d="{{OUTER_STEP}}" fill="none" stroke="#9C6319" stroke-width="2.2" marker-end="url(#gradient-arrow)"/><path id="outer-trail" d="{{OUTER_STEP}}" fill="none" stroke="#BF8736" stroke-width="2.6"/><circle id="outer-start" cx="{{OUTER_SX}}" cy="{{OUTER_SY}}" r="3.5" fill="#148F87" stroke="#fff" stroke-width="1"/><circle id="outer-dot" cx="{{OUTER_DX}}" cy="{{OUTER_DY}}" r="5" fill="#BF8736" stroke="#fff" stroke-width="1.5"/><text x="1034" y="541" class="small" style="font-size:13px">y₁</text><text x="801" y="448" class="small" style="font-size:13px">y₂</text><text x="925" y="554" class="small" style="font-size:13px" text-anchor="middle">Negative penalty gradient · illustrative</text></g>
<g class="step" id="method-project" data-step="project"><rect class="box" x="405" y="360" width="290" height="205" rx="10" fill="url(#teal)"/><circle class="number" cx="428" cy="386" r="13"/><text class="numtext" x="428" y="391" text-anchor="middle">5</text><text class="title" x="451" y="394">Project the design</text><path d="{{DESIGN_BOX}}Z" fill="#E1F1ED" stroke="#148F87" stroke-width="1.5"/><text x="516" y="443" class="formula" style="font-size:18px">Cₚ</text><path id="projection-trail" d="{{PROJECTION_STEP}}" fill="none" stroke="#9C6319" stroke-width="2"/><circle id="projection-target" cx="{{PROJ_TX}}" cy="{{PROJ_TY}}" r="5" fill="#148F87" stroke="#fff" stroke-width="1"/><circle id="projection-dot" cx="{{PROJ_DX}}" cy="{{PROJ_DY}}" r="4.5" fill="#BF8736" stroke="#fff" stroke-width="1"/><text class="formula" x="603" y="448" text-anchor="middle">yᵏ⁺¹</text><text class="formula" x="603" y="480" text-anchor="middle">= Π<tspan font-size="16" baseline-shift="sub">Cₚ</tspan>(ỹ)</text><text class="small" x="550" y="548" text-anchor="middle">enforce design-only constraints</text></g>
<g class="step" id="method-output" data-step="output"><rect class="box" x="30" y="360" width="290" height="205" rx="10" fill="url(#teal)"/><circle class="number" cx="53" cy="386" r="13"/><text class="numtext" x="53" y="391" text-anchor="middle">6</text><text class="title" x="76" y="394">Final solve + output</text><text class="formula" x="175" y="444" text-anchor="middle">zᴷ = Oₚ(yᴷ)</text><text class="formula" x="175" y="489" text-anchor="middle">(yᴷ, zᴷ)</text><text class="small" x="175" y="525" text-anchor="middle">design and corresponding</text><text class="small" x="175" y="548" text-anchor="middle">lower-level control solution</text></g>
<path class="wire" d="M780 465H695"/><text class="small" x="738" y="449" text-anchor="middle">update</text><path class="wire" d="M405 465H320"/><text class="small" x="362" y="438" text-anchor="middle">after K</text><text class="small" x="362" y="455" text-anchor="middle">steps</text><path class="wire loop" d="M550 360V290"/><text class="small" x="567" y="326">repeat</text><text class="small" x="567" y="347">correction</text>
<g class="step" id="method-training" data-step="training"><rect class="box" x="30" y="613" width="1040" height="121" rx="10" fill="#F1F0F7"/><text class="kicker" x="53" y="642">OFFLINE TRAINING</text><text class="title" x="53" y="676">Objective + coupling penalty</text><text class="label" x="53" y="709">Evaluate the returned pair.</text><path class="wire" d="M433 679H493"/><text class="label" x="513" y="670">Differentiate through the</text><text class="label" x="513" y="697">unrolled correction stages.</text><path class="wire" d="M795 679H845"/><text class="title" x="867" y="676">Update θ</text><text class="small" x="867" y="706">network weights</text></g><path class="wire" d="M175 565V613"/><text class="small" x="404" y="594">At inference, θ is fixed; the design corrections still run.</text><path class="wire loop" stroke-dasharray="5 5" d="M1030 734V747H15V220H30"/>
</svg>
